# =====================================================================
# Reservas de restaurante - configuracion de Spring.
# ESTE ARCHIVO SI SE SUBE A GITHUB: no lleva ninguna contrasena.
# Cada valor ${VARIABLE:defecto} se toma de:
#   - En tu computadora: application-local.properties (no se sube a git).
#   - En un servidor como Render: las "Environment Variables" del servicio.
# =====================================================================
spring.application.name=spring-reservas
spring.config.import=optional:classpath:application-local.properties

# El servidor asigna el puerto en la variable PORT; en tu computadora es el 8080
server.port=${PORT:8080}

# ---------------- Base de datos ----------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/restaurante_reservas}
# En tu computadora las tablas van en "public". En Supabase se usa el esquema "reservas"
# (variable DB_SCHEMA) para NO mezclarlas con las de StreamList, que viven en "public".
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:}
# update = crea las tablas que falten sin borrar lo que ya existe
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.properties.hibernate.hbm2ddl.create_namespaces=true
spring.datasource.hikari.maximum-pool-size=${DB_POOL:5}

# ---------------- Seguridad ----------------
# false = el codigo de verificacion del correo SOLO llega por correo (nunca en la respuesta).
# Ponlo en true solo si estas probando sin correo configurado.
registro.devolver-codigo=${REGISTRO_DEVOLVER_CODIGO:false}

# ---------------- Datos de arranque ----------------
# Cuenta de administrador que se crea la primera vez.
datos.admin-correo=${ADMIN_CORREO:admin@restaurante.local}
datos.admin-password=${ADMIN_PASSWORD:Admin1234}
# true = carga mesas, carta, cuentas y reservas de ejemplo (para la demostracion).
# Ponlo en false si quieres arrancar con el restaurante vacio.
datos.ejemplos=${DATOS_EJEMPLOS:true}

# Paginas que pueden llamar a esta API desde el navegador (separadas por comas)
cors.origenes=${CORS_ORIGENES:http://localhost:4200,http://127.0.0.1:4200,https://paginapro.store,https://www.paginapro.store,https://*.vercel.app}

# ---------------- Correo ----------------
# Si hay RESEND_API_KEY se envia con Resend; si no, con Gmail (spring.mail.*).
# Si no hay ninguno, el correo se imprime en la consola (suficiente para la demostracion).
correo.resend-api-key=${RESEND_API_KEY:}
correo.remitente=${CORREO_REMITENTE:}
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USER:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
